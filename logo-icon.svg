<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff007f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff007f;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="60" cy="60" r="55" fill="url(#gradient-glow)" opacity="0.15"/>

  <!-- Outer hexagon (cryptographic cell) -->
  <path d="M 60 15 L 85.98 30 L 85.98 60 L 60 75 L 34.02 60 L 34.02 30 Z"
        fill="none"
        stroke="url(#gradient-primary)"
        stroke-width="3.5"/>

  <!-- Inner clockwork gear teeth -->
  <g transform="translate(60, 60)">
    <!-- Gear teeth circle -->
    <circle r="30" fill="none" stroke="url(#gradient-primary)" stroke-width="3"/>

    <!-- 8 gear teeth -->
    <rect x="-3" y="-37" width="6" height="9" fill="url(#gradient-primary)" rx="1"/>
    <rect x="-3" y="28" width="6" height="9" fill="url(#gradient-primary)" rx="1"/>
    <rect x="-37" y="-3" width="9" height="6" fill="url(#gradient-primary)" rx="1"/>
    <rect x="28" y="-3" width="9" height="6" fill="url(#gradient-primary)" rx="1"/>

    <!-- Diagonal teeth -->
    <rect x="-26" y="-29" width="6" height="9" fill="url(#gradient-primary)" transform="rotate(-45)" rx="1"/>
    <rect x="-26" y="20" width="6" height="9" fill="url(#gradient-primary)" transform="rotate(45)" rx="1"/>
    <rect x="20" y="-29" width="6" height="9" fill="url(#gradient-primary)" transform="rotate(45)" rx="1"/>
    <rect x="20" y="20" width="6" height="9" fill="url(#gradient-primary)" transform="rotate(-45)" rx="1"/>

    <!-- Central prime/modular symbol -->
    <text x="0" y="0"
          font-family="JetBrains Mono, monospace"
          font-size="32"
          font-weight="bold"
          fill="url(#gradient-primary)"
          text-anchor="middle"
          dominant-baseline="central">%</text>
  </g>
</svg>
